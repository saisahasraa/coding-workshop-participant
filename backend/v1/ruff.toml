target-version = "py313"
line-length = 120
include = ["function.py", "app/**/*.py", "tests/**/*.py"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM"]
ignore = [
  "S101",  # assert is how pytest expresses checks
  "N818",  # exceptions are named after HTTP statuses (NotFound, Conflict, ...)
]

[lint.isort]
known-first-party = ["app", "tests", "function"]
# Vendored copies of these live in this folder (LocalStack hot-reload); they are still third-party.
known-third-party = ["psycopg", "psycopg_binary", "jwt"]

[lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107"]  # test fixtures use literal passwords
